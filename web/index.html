<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="منصة الأستاذ شعبان المنهراوي التعليمية - نظام الحضور الذكي بالـ QR Code وإشعارات أولياء الأمور والماليات">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="أ. شعبان المنهراوي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>منصة الأستاذ شعبان المنهراوي التعليمية</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0b0f19;
      font-family: 'Cairo', sans-serif;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%);
      color: #ffffff;
      z-index: 99999;
      transition: opacity 0.5s ease;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4338ca, #1e1b4b);
      border: 3px solid #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.45), 0 0 20px rgba(245, 158, 11, 0.3);
      margin-bottom: 20px;
      animation: pulseLogo 1.8s infinite ease-in-out;
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.45); }
      50% { transform: scale(1.07); box-shadow: 0 16px 40px rgba(99, 102, 241, 0.65), 0 0 25px rgba(245, 158, 11, 0.4); }
    }
    .loading-title {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    .loading-sub {
      font-size: 0.86rem;
      color: #cbd5e1;
      margin-bottom: 24px;
    }
    .loading-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #818cf8;
      border-right-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="loading-logo">ش</div>
    <div class="loading-title">منصة الأستاذ شعبان المنهراوي</div>
    <div class="loading-sub">جاري تشغيل النظام...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
