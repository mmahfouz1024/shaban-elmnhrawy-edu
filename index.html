<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الأستاذ شعبان المنهراوي التعليمية | نظام الـ QR Code والحضور والحسابات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>

  <!-- شريط التنقل العلوي النظيف -->
  <header class="app-topbar">
    <div class="topbar-brand">
      <div class="brand-icon-box">ش</div>
      <div class="brand-meta">
        <h1>منصة الأستاذ شعبان المنهراوي</h1>
        <p>المرحلة الابتدائية والإعدادية • الحضور الذكي بالـ QR Code والماليات</p>
      </div>
    </div>

    <!-- معلومات المستخدم الحالي وزر تسجيل الخروج -->
    <div class="topbar-user" id="topbar-user-area">
      <!-- يتم حقنها برمجياً عند تسجيل الدخول -->
    </div>
  </header>

  <!-- =====================================================================
       1. شاشة تسجيل الدخول الموحدة (Login Screen)
       ===================================================================== -->
  <section id="login-view" class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-header-icon" id="login-role-icon">👨‍🏫</div>
        <h2>تسجيل الدخول للنظام</h2>
        <p id="login-role-desc">اختر صفة الدخول للمتابعة</p>
      </div>

      <!-- تبويب اختيار صفة المستخدم -->
      <div class="role-tabs">
        <button class="role-tab-btn active" data-role="teacher" onclick="App.selectLoginRole('teacher')">
          <span style="font-size:1.1rem;">👨‍🏫</span>
          <span>المعلم / الإدارة</span>
        </button>
        <button class="role-tab-btn" data-role="student" onclick="App.selectLoginRole('student')">
          <span style="font-size:1.1rem;">👨‍🎓</span>
          <span>الطالب</span>
        </button>
        <button class="role-tab-btn" data-role="parent" onclick="App.selectLoginRole('parent')">
          <span style="font-size:1.1rem;">👨‍👩‍👧‍👦</span>
          <span>ولي الأمر</span>
        </button>
      </div>

      <!-- نموذج تسجيل الدخول للمعلم -->
      <form id="teacher-login-form" onsubmit="event.preventDefault(); App.loginAsTeacher();">
        <div class="form-group">
          <label class="form-label">اسم المستخدم أو الحساب:</label>
          <input type="text" id="teacher-username" class="form-input" value="الأستاذ شعبان المنهراوي" readonly style="background:var(--bg-subtle);">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور:</label>
          <input type="password" id="teacher-password" class="form-input" value="admin" placeholder="أدخل كلمة المرور (افتراضي: admin)">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding:12px; font-size:0.95rem;">
          تسجيل الدخول إلى لوحة المعلم 🚀
        </button>
      </form>

      <!-- نموذج تسجيل الدخول للطالب -->
      <form id="student-login-form" style="display:none;" onsubmit="event.preventDefault(); App.loginAsStudent();">
        <div class="form-group">
          <label class="form-label">اختر حساب الطالب (أو أدخل كود الطالب):</label>
          <select id="student-login-select" class="form-input">
            <!-- يتم تعبئتها من قائمة الطلاب -->
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">أو أدخل كود الطالب يدوياً:</label>
          <input type="text" id="student-code-input" class="form-input" placeholder="مثال: STU-2026-1001">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding:12px; font-size:0.95rem;">
          فتح ملف الطالب وإظهار الـ QR Code 🪪
        </button>
      </form>

      <!-- نموذج تسجيل الدخول لولي الأمر -->
      <form id="parent-login-form" style="display:none;" onsubmit="event.preventDefault(); App.loginAsParent();">
        <div class="form-group">
          <label class="form-label">اختر حساب ولي الأمر (أو أدخل رقم الموبايل):</label>
          <select id="parent-login-select" class="form-input">
            <!-- يتم تعبئتها من قائمة أولياء الأمور -->
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">أو أدخل رقم الموبايل / كود الدخول:</label>
          <input type="text" id="parent-phone-input" class="form-input" placeholder="مثال: 01011223344">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding:12px; font-size:0.95rem;">
          دخول بوابة ولي الأمر ومتابعة الأبناء 🔔
        </button>
      </form>

      <!-- مربع الدخول السريع التجريبي بنقرة واحدة -->
      <div class="quick-test-box">
        <p>💡 دخول سريع للتجربة بنقرة واحدة:</p>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="App.quickLogin('teacher')">دخول المعلم</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="App.quickLogin('student')">دخول طالب تجريبي</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="App.quickLogin('parent')">دخول ولي أمر تجريبي</button>
        </div>
      </div>
    </div>
  </section>

  <!-- =====================================================================
       2. واجهة المعلم المبسطة والأنيقة (Teacher / Admin View)
       ===================================================================== -->
  <main id="teacher-view" class="admin-container" style="display:none;">
    <!-- شريط التبويبات الأفقي المبسط والواضح -->
    <nav class="admin-nav-bar">
      <button class="nav-pill active" data-tab="dashboard" onclick="App.switchTeacherTab('dashboard')">
        📊 لوحة المؤشرات
      </button>
      <button class="nav-pill" data-tab="scanner" onclick="App.switchTeacherTab('scanner')">
        📷 ماسح الـ QR الذكي
      </button>
      <button class="nav-pill" data-tab="students" onclick="App.switchTeacherTab('students')">
        👨‍🎓 الطلاب والكارنيهات
      </button>
      <button class="nav-pill" data-tab="parents" onclick="App.switchTeacherTab('parents')">
        👨‍👩‍👧‍👦 أولياء الأمور والواتساب
      </button>
      <button class="nav-pill" data-tab="finances" onclick="App.switchTeacherTab('finances')">
        💰 الحسابات والاشتراكات
      </button>
      <button class="nav-pill" data-tab="settings" onclick="App.switchTeacherTab('settings')">
        ⚙️ الإعدادات وقوالب الرسائل
      </button>
    </nav>

    <!-- مساحة المحتوى الخاص بتبويبات المعلم -->
    <section id="teacher-tab-content">
      <!-- يتم حقن المحتوى ديناميكياً هنا -->
    </section>
  </main>

  <!-- =====================================================================
       3. واجهة الطالب المبسطة (Student View)
       ===================================================================== -->
  <main id="student-view" class="admin-container" style="display:none; max-width:800px;">
    <!-- يتم حقن شاشة الطالب المحددة برمز الـ QR الخاص به وتاريخ حضوره -->
  </main>

  <!-- =====================================================================
       4. واجهة ولي الأمر المبسطة (Parent View)
       ===================================================================== -->
  <main id="parent-view" class="admin-container" style="display:none; max-width:920px;">
    <!-- يتم حقن شاشة ولي الأمر وتنبيهات الحضور والانصراف والواتساب -->
  </main>

  <!-- حاوية التنبيهات الفورية (Toasts) -->
  <div id="toast-box" class="toast-box"></div>

  <!-- حاوية النوافذ المنبثقة العامة (Modals) -->
  <div id="app-modal-backdrop" style="position:fixed; inset:0; background:rgba(15,23,42,0.6); backdrop-filter:blur(3px); z-index:2000; display:none; align-items:center; justify-content:center; padding:16px;"></div>

  <!-- السكربتات المدمجة -->
  <script src="js/qrcode-engine.js"></script>
  <script src="js/seed-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
