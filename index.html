<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الأستاذ شعبان المنهراوي | إدارة الطلاب والـ QR Code والحضور والماليات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>

  <!-- شريط التبديل العلوي للبوابات (الأستاذ | الطالب | ولي الأمر | استوديو المحاكاة الحية) -->
  <header class="portal-switcher-bar">
    <div class="brand-header">
      <div class="brand-logo">ش</div>
      <div class="brand-title">
        <h1>الأستاذ شعبان المنهراوي</h1>
        <p>نظام إدارة الطلاب بالـ QR Code • المرحلة الابتدائية والإعدادية • إشعارات الواتساب والماليات</p>
      </div>
    </div>

    <!-- أزرار التبديل الفوري بين البوابات -->
    <div class="portal-tabs">
      <button class="portal-tab-btn active" data-portal="admin" onclick="App.switchPortal('admin')">
        👨‍🏫 لوحة المعلم (الأدمن)
      </button>
      <button class="portal-tab-btn" data-portal="student" onclick="App.switchPortal('student')">
        👨‍🎓 بوابة الطالب (الملف والـ QR)
      </button>
      <button class="portal-tab-btn" data-portal="parent" onclick="App.switchPortal('parent')">
        👨‍👩‍👧‍👦 بوابة ولي الأمر (الإشعارات)
        <span class="notif-badge-pill" id="parent-portal-notif-pill" style="display:none;">0</span>
      </button>
      <button class="portal-tab-btn studio-tab" data-portal="studio" onclick="App.switchPortal('studio')">
        🎬 استوديو المحاكاة الحية (4 شاشات)
      </button>
    </div>

    <!-- شارة حالة الخادم والتبديل للمظهر الليلي -->
    <div class="header-actions">
      <span id="server-status-badge" class="badge badge-primary-stage">
        ● جاري فحص الاتصال...
      </span>
      <button class="btn btn-outline btn-sm" onclick="document.body.classList.toggle('dark-mode')" title="تبديل الوضع الليلي / الفاتح" style="color:#fff; border-color:rgba(255,255,255,0.2);">
        🌓
      </button>
    </div>
  </header>

  <!-- 1. لوحة المعلم (الأدمن) - Admin Portal -->
  <main id="admin-portal" class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-section-label">لوحة التحكم الرئيسية</div>
      <button class="nav-item active" data-tab="dashboard" onclick="App.navigateToAdminTab('dashboard')">
        <span class="nav-item-right">📊 لوحة القيادة العامة</span>
      </button>
      <button class="nav-item" data-tab="scanner" onclick="App.navigateToAdminTab('scanner')">
        <span class="nav-item-right">📷 ماسح الـ QR الذكي</span>
        <span class="nav-badge" style="background:#14b8a6; color:#042f2e;">سريع ⚡</span>
      </button>

      <div class="sidebar-section-label">إدارة الطلاب والمجموعات</div>
      <button class="nav-item" data-tab="students" onclick="App.navigateToAdminTab('students')">
        <span class="nav-item-right">👨‍🎓 سجل الطلاب والكارنيهات</span>
      </button>
      <button class="nav-item" data-tab="parents" onclick="App.navigateToAdminTab('parents')">
        <span class="nav-item-right">👨‍👩‍👧‍👦 بيانات أولياء الأمور</span>
      </button>
      <button class="nav-item" data-tab="groups" onclick="App.navigateToAdminTab('groups')">
        <span class="nav-item-right">📚 المجموعات (ابتدائي وإعدادي)</span>
      </button>
      <button class="nav-item" data-tab="attendance" onclick="App.navigateToAdminTab('attendance')">
        <span class="nav-item-right">📋 سجل الحضور والانصراف</span>
      </button>

      <div class="sidebar-section-label">الماليات والتواصل</div>
      <button class="nav-item" data-tab="finances" onclick="App.navigateToAdminTab('finances')">
        <span class="nav-item-right">💰 الحسابات والاشتراكات</span>
      </button>
      <button class="nav-item" data-tab="whatsapp" onclick="App.navigateToAdminTab('whatsapp')">
        <span class="nav-item-right">📲 إشعارات الواتساب</span>
      </button>
      <button class="nav-item" data-tab="settings" onclick="App.navigateToAdminTab('settings')">
        <span class="nav-item-right">⚙️ إعدادات النظام والقوالب</span>
      </button>

      <div style="margin-top:auto; padding:12px; background:var(--bg-elevated); border-radius:10px; border:1px solid var(--border-color); font-size:0.75rem;">
        <strong style="display:block; margin-bottom:4px;">سنتر أ. شعبان المنهراوي</strong>
        <span style="color:var(--text-light);">العام الدراسي 2026 / 2027</span>
      </div>
    </aside>

    <section class="main-content" id="admin-main-viewport">
      <!-- يتم حقن أقسام لوحة المعلم ديناميكياً هنا عبر App.js -->
    </section>
  </main>

  <!-- 2. بوابة الطالب (ملفه وكارنيه الـ QR Code الخاص به) - Student Portal -->
  <section id="student-portal" style="display:none; min-height:calc(100vh - 66px);">
    <!-- يتم حقن شاشة الطالب والكارنيه ديناميكياً هنا -->
  </section>

  <!-- 3. بوابة ولي الأمر (مركز إشعارات الحضور والانصراف والواتساب) - Parent Portal -->
  <section id="parent-portal" style="display:none; min-height:calc(100vh - 66px);">
    <!-- يتم حقن شاشة ولي الأمر وتنبيهات الأبناء ديناميكياً هنا -->
  </section>

  <!-- 4. استوديو المحاكاة الحية (4 شاشات متزامنة للطالب والماسح والنظام وواتساب) - Studio Portal -->
  <section id="studio-portal" style="display:none; min-height:calc(100vh - 66px);">
    <!-- يتم حقن الاستوديو الرباعي ديناميكياً هنا -->
  </section>

  <!-- حاوية التنبيهات الفورية (Toasts) -->
  <div id="toast-container" class="toast-container"></div>

  <!-- السكربتات المدمجة المتكاملة بدون أي مكتبات خارجية -->
  <script src="js/qrcode-engine.js"></script>
  <script src="js/seed-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
